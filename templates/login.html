{% extends "base.html" %}

{% block title %}Admin Login · AttendEase{% endblock %}

{% block content %}

<section class="login">

    <div class="logo">A</div>

    <p class="eyebrow">STUDENT MANAGEMENT PORTAL</p>

    <h1>Welcome back</h1>

    <p class="muted">
        Sign in to manage student attendance.
    </p>

    <form method="post">

        <label>
            Username
            <input
                type="text"
                name="username"
                required
                placeholder="Enter username">
        </label>

        <label>
            Password
            <input
                type="password"
                name="password"
                required
                placeholder="Enter password">
        </label>

        <button class="btn primary full">
            Sign in to dashboard →
        </button>

    </form>

    <aside>
        <b>Demo login</b><br>
        Username: <code>admin</code><br>
        Password: <code>admin123</code>
    </aside>

</section>

{% endblock %}
