{% extends "base.html" %}{% block title %}Student Registration · AttendEase{% endblock %}{% block content %}<section class="login"><div class="logo">A</div><p class="eyebrow">STUDENT PORTAL</p><h1>Create account</h1><p class="muted">Register with your own student details.</p><form method="post"><label>Roll number<input name="roll_no" required placeholder="Unique roll number"></label><label>Full name<input name="name" required placeholder="Your name"></label><label>Course<input name="course" required placeholder="e.g. BCA"></label><label>Semester<input name="semester" required placeholder="e.g. 5"></label><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" minlength="8" required placeholder="At least 8 characters"></label><label>Confirm password<input type="password" name="confirm_password" minlength="8" required placeholder="Repeat password"></label><button class="btn primary full">Create student account →</button></form><p class="muted" style="margin-top:18px">Already registered? <a href="{{ url_for('student_login') }}">Student login</a></p></section>{% endblock %}
